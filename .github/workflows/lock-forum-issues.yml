# Issues opened from the forum are just an index: the discussion stays on the forum.
# Lock each one as soon as TLI-Bug opens it, so that only collaborators can comment on GitHub.
# 📚 https://github.com/TurboLabIt/TurboLab.it/blob/main/docs/bug.md
name: Lock forum issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  lock:
    if: github.event.issue.user.login == 'TLI-Bug'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: gh issue lock "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
