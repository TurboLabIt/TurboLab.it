;
; This file is under version control!
; DO NOT EDIT DIRECTLY - If you do, you'll loose your changes!
;
; The original file is in `/var/www/turbolab.it/config/custom/dev`
;
; You MUST:
;
; 1. edit the original file on you PC
; 2. Git-commit+push the changes
; 3. run `sudo bash /var/www/turbolab.it/scripts/deploy.sh`
;
; ⚠️ This file is for the DEV env only ⚠️
;
; It must load after zz_webstackup-fpm-pool.conf (pm = static, 30 children), so it's
; installed as pool.d/zzz_turbolab.it-dev.conf by scripts/cache-clear.sh
;
; 🪄 Based on https://github.com/TurboLabIt/webstackup/blob/master/my-app-template/config/custom/php-fpm.conf

[www]
;; dev0 is a small VM with a single user: spawn workers on request, kill them when idle
pm = ondemand
pm.process_idle_timeout = 30s

;; 4 vCPUs: more children only add RAM. Bursts (e.g. the test suite) queue for a free worker
pm.max_children = 8

;; recycle workers periodically, so a leaky request can't keep its memory forever
pm.max_requests = 500
