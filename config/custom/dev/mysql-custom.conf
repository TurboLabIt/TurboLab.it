[mysqld]

## dev0 is a small VM: shrink MySQL to fit (overrides 00-webstackup.cnf, sized for a 32GB server).
# All InnoDB data (all databases) is ~0.9 GB; the dev workload is light and single-user.
#
# Check: SELECT ROUND(SUM(data_length+index_length)/POWER(1024,3),2) GB FROM information_schema.tables WHERE engine='InnoDB';
innodb_buffer_pool_size = 1G
innodb_buffer_pool_instances = 1
innodb_log_buffer_size = 16M

## Instrumentation: ~200 MB of always-allocated memory, not needed on dev
performance_schema = OFF

## Per-connection and on-demand buffers: cap them to their defaults or below
max_connections = 100
join_buffer_size = 256K
temptable_max_ram = 64M
table_open_cache = 400
table_definition_cache = 400
key_buffer_size = 1M
